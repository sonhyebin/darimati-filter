<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>DARIMATI — Race Day Filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@500;700;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="frame-ribbon.jpg">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
  --sans:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;
  --kr:"Noto Sans KR","Manrope",-apple-system,sans-serif;
  --gold:#C8A44E;
  --controls-h:104px;
}
html,body { width:100%; height:100%; overflow:hidden; background:#f0f0f0; font-family:var(--sans); touch-action:manipulation; }

/* ── LANDING ── */
#permissionScreen {
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  background:#fff; color:#111; overflow:hidden;
}
.landing-hero {
  position:relative; width:100%; height:100vh; height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:2rem; overflow:hidden; background:#fff; text-align:center;
}
.hero-brand {
  font-size:clamp(1.4rem,6vw,2rem); font-weight:800; letter-spacing:0.5em;
  color:#111; margin-bottom:0.2rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s both;
}
.hero-sub {
  font-size:0.72rem; font-weight:700; letter-spacing:0.35em; color:var(--gold);
  margin-bottom:0.4rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.4s both;
}
.hero-rule { width:48px; height:1px; background:rgba(0,0,0,0.15); margin:0.5rem auto 0.6rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
.hero-detail {
  font-family:var(--kr);
  font-size:0.68rem; font-weight:500; color:rgba(0,0,0,0.4); letter-spacing:0.18em;
  margin-bottom:2.4rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.6s both;
}
.hero-cta-area {
  display:flex; flex-direction:column; align-items:center; gap:0.8rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.8s both;
}
#startCameraBtn {
  background:#111; color:#fff;
  border:none; padding:1rem 3.2rem; font-size:0.78rem;
  font-weight:700; letter-spacing:0.22em;
  text-transform:uppercase; cursor:pointer; transition:all 0.15s;
}
#startCameraBtn:active { opacity:0.7; transform:scale(0.97); }
.cta-notice {
  font-family:var(--kr);
  font-size:0.6rem; color:rgba(0,0,0,0.35); line-height:1.7; max-width:260px; text-align:center;
}
.hero-bottom-mark {
  position:absolute; bottom:calc(1.5rem + var(--safe-bottom)); left:0; right:0;
  text-align:center; font-size:0.58rem; color:rgba(0,0,0,0.15); letter-spacing:0.12em; font-weight:500;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1s both;
}
#permissionScreen .msg { display:none; }
#permissionScreen .msg.error {
  display:block; font-family:var(--kr);
  font-size:0.78rem; color:#e74c3c; line-height:1.7; max-width:280px;
}
@keyframes heroFadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

/* ── APP ── */
#app { display:none; position:fixed; inset:0; background:#e2e2e2; }
#viewfinder {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  overflow:hidden; padding:calc(var(--safe-top) + 0.35rem) 0.35rem calc(var(--controls-h) + var(--safe-bottom));
}
/* not display:none — iOS Safari can stop decoding hidden camera video */
#cameraVideo { position:absolute; width:2px; height:2px; opacity:0; pointer-events:none; }
/* the canvas carries the frame's own aspect ratio — contain keeps the artwork undistorted */
#displayCanvas { width:100%; height:100%; object-fit:contain; }

/* ── SEGMENTATION LOADING ── */
#segLoading {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:15; display:none; flex-direction:column; align-items:center; gap:0.6rem;
  color:#888; font-size:0.7rem; letter-spacing:0.1em;
}

/* ── SHUTTER COUNTDOWN ── */
#shutterCountdown {
  position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
  z-index:14; display:none; align-items:center; justify-content:center;
  pointer-events:none;
}
#shutterCountdown .countdown-num {
  font-size:clamp(5rem,22vw,8rem); font-weight:900;
  color:#111; letter-spacing:0.02em;
  text-shadow:0 2px 20px rgba(255,255,255,0.7);
  animation:countPulse 0.8s ease-out;
}
@keyframes countPulse {
  0% { transform:scale(1.5); opacity:0; }
  30% { transform:scale(1); opacity:1; }
  100% { transform:scale(0.95); opacity:0.9; }
}

/* ── FILTER TOGGLE ── */
.filter-btns {
  position:absolute; top:calc(var(--safe-top) + 0.8rem); right:0.8rem; z-index:12;
  display:flex; flex-direction:column; gap:0.35rem;
}
.filter-btn {
  background:rgba(255,255,255,0.7); border:1.5px solid rgba(0,0,0,0.1);
  color:#333; padding:0.3rem 0.65rem; font-size:0.5rem;
  font-weight:700; letter-spacing:0.14em;
  cursor:pointer; transition:all 0.2s; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  pointer-events:auto;
}
.filter-btn.active { background:#111; color:#fff; border-color:#111; }
.filter-btn:active { transform:scale(0.94); }

/* ── CONTROLS ── */
#controlsBar {
  position:absolute; bottom:0; left:0; right:0; z-index:10;
  display:flex; align-items:center; justify-content:center; gap:1.2rem;
  height:calc(var(--controls-h) + var(--safe-bottom));
  padding:0 1.5rem calc(0.5rem + var(--safe-bottom));
  background:linear-gradient(to top,rgba(226,226,226,0.95) 40%,transparent 100%);
}
#captureBtn {
  width:66px; height:66px; border-radius:50%;
  border:3px solid #111; background:transparent;
  cursor:pointer; position:relative; transition:transform 0.15s;
}
#captureBtn::after {
  content:""; position:absolute; inset:4px; border-radius:50%;
  background:#111; transition:transform 0.15s;
}
#captureBtn:active { transform:scale(0.88); }
#captureBtn:active::after { transform:scale(0.84); }
.ctrl-btn {
  width:42px; height:42px; border-radius:50%; border:none;
  background:rgba(0,0,0,0.08); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  color:#333; font-size:1.1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:transform 0.3s;
  position:relative;
}
#flipBtn:active { transform:rotate(180deg); }
#recordBtn.has-data { background:#111; color:#fff; }
#shutterTimerBtn.active { background:#111; color:#fff; }
#shutterTimerBadge {
  position:absolute; top:-5px; right:-5px; min-width:16px; height:16px;
  background:var(--gold); color:#fff; border-radius:8px;
  font-size:0.46rem; font-weight:800;
  display:none; align-items:center; justify-content:center; padding:0 3px; line-height:1;
}

/* ── RECORD PANEL ── */
#recordPanel {
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:55;
  background:rgba(255,255,255,0.96); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border-top:1px solid rgba(0,0,0,0.08);
  padding:1.5rem 1.5rem calc(1.5rem + var(--safe-bottom));
  border-radius:18px 18px 0 0; max-height:78vh; overflow-y:auto;
  transform:translateY(100%); transition:transform 0.32s ease;
}
#recordPanel.open { display:block; transform:translateY(0); }
#recordPanel .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; }
#recordPanel .panel-title { font-family:var(--kr); color:#111; font-size:0.82rem; font-weight:700; letter-spacing:0.16em; }
#recordPanel .panel-close { background:none; border:none; color:#999; font-size:1.5rem; cursor:pointer; }
.record-field { margin-bottom:0.9rem; }
.record-field label { font-family:var(--kr); display:block; color:#888; font-size:0.64rem; font-weight:600; letter-spacing:0.14em; margin-bottom:0.35rem; }
.record-field input,.record-field select {
  width:100%; background:rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.1);
  color:#111; padding:0.6rem 0.75rem; font-size:0.92rem; font-family:var(--kr);
  border-radius:6px; outline:none; transition:border-color 0.2s;
}
.record-field input:focus,.record-field select:focus { border-color:rgba(0,0,0,0.3); }
.record-field select { -webkit-appearance:none; appearance:none; }
.time-inputs { display:flex; align-items:center; gap:0.3rem; }
.time-inputs input { width:68px; text-align:center; font-size:1.7rem; font-weight:900; padding:0.45rem 0.25rem; letter-spacing:0.04em; font-family:var(--sans); }
.time-inputs .sep { color:#ccc; font-size:1.7rem; font-weight:900; }
.record-actions { display:flex; gap:0.5rem; margin-top:1.1rem; }
.record-actions button {
  flex:1; padding:0.72rem; font-size:0.8rem; font-weight:700; letter-spacing:0.14em;
  font-family:var(--kr);
  border:none; border-radius:6px; cursor:pointer;
}
#recordApplyBtn { background:#111; color:#fff; }
#recordClearBtn { background:rgba(0,0,0,0.06); color:#888; }

/* ── REVIEW ── */
#reviewScreen {
  display:none; position:fixed; inset:0; z-index:50; background:#f5f5f5;
  flex-direction:column; align-items:center; justify-content:center; gap:0;
  padding:1rem;
}
#reviewImage { max-width:92%; max-height:62vh; object-fit:contain; box-shadow:0 4px 30px rgba(0,0,0,0.12); }
.review-tools { display:flex; gap:0.4rem; margin-top:1rem; align-items:center; flex-wrap:wrap; justify-content:center; }
.review-chip {
  background:rgba(255,255,255,0.9); border:1.5px solid rgba(0,0,0,0.12);
  color:#333; padding:0.45rem 0.95rem; font-size:0.58rem; font-weight:700; letter-spacing:0.14em;
  cursor:pointer; transition:all 0.2s;
}
.review-chip.active { background:#111; color:#fff; border-color:#111; }
.review-chip:active { transform:scale(0.95); }
#reviewRecordBtn { font-family:var(--kr); letter-spacing:0.08em; }
.review-actions {
  display:flex; gap:0.75rem; margin-top:1.4rem;
  padding-bottom:calc(0.5rem + var(--safe-bottom));
  flex-wrap:wrap; justify-content:center;
}
.review-btn {
  border:none; padding:0.85rem 1.8rem; font-size:0.78rem; font-weight:700;
  letter-spacing:0.2em; cursor:pointer; transition:opacity 0.2s;
}
.review-btn:active { opacity:0.65; }
.review-btn.share-save { background:#111; color:#fff; }
.review-btn.download-btn { background:transparent; color:rgba(0,0,0,0.5); border:1px solid rgba(0,0,0,0.15); padding:0.85rem 1.3rem; }
.review-btn.retake { background:transparent; color:rgba(0,0,0,0.4); border:1px solid rgba(0,0,0,0.12); }

/* ── MISC ── */
.flash { position:fixed; inset:0; background:#fff; z-index:60; animation:flashAnim 0.32s ease-out forwards; pointer-events:none; }
@keyframes flashAnim { 0%{opacity:0.85} 100%{opacity:0} }
#exportCanvas { display:none; }
.loading { display:inline-block; width:22px; height:22px; border:2.5px solid rgba(0,0,0,0.1); border-top-color:rgba(0,0,0,0.5); border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<!-- LANDING -->
<div id="permissionScreen">
  <section class="landing-hero">
    <div class="hero-brand">DARIMATI</div>
    <div class="hero-sub">REXTREME</div>
    <div class="hero-rule"></div>
    <p class="hero-detail">2026. 08. 01 &nbsp;·&nbsp; 수원컨벤션센터</p>
    <div class="hero-cta-area">
      <button id="startCameraBtn">START CAMERA</button>
      <p class="msg" id="permMsg"></p>
      <p class="cta-notice">카메라 접근 권한이 필요합니다.<br>촬영한 사진은 기기에만 저장됩니다.</p>
    </div>
    <p class="hero-bottom-mark">DARIMATI &nbsp;·&nbsp; Race Day Filter</p>
  </section>
</div>

<!-- MAIN APP -->
<div id="app">
  <div id="viewfinder">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="displayCanvas"></canvas>
  </div>

  <div id="segLoading">
    <span class="loading"></span>
    <span>LOADING...</span>
  </div>

  <div id="shutterCountdown">
    <span class="countdown-num" id="countdownNum"></span>
  </div>

  <!-- FILTER TOGGLE -->
  <div class="filter-btns" id="filterBtnsBar">
    <button class="filter-btn active" data-filter="ribbon">RIBBON</button>
    <button class="filter-btn" data-filter="sport">SPORT</button>
    <button class="filter-btn" data-filter="minimal">MINIMAL</button>
    <button class="filter-btn" data-filter="dark">DARK</button>
  </div>

  <!-- CONTROLS -->
  <div id="controlsBar">
    <button id="recordBtn" class="ctrl-btn" aria-label="Record">✎</button>
    <button id="shutterTimerBtn" class="ctrl-btn" aria-label="Shutter Timer">⏱<span id="shutterTimerBadge"></span></button>
    <button id="captureBtn" aria-label="Capture"></button>
    <button id="flipBtn" class="ctrl-btn" aria-label="Flip Camera">⟳</button>
  </div>
</div>

<!-- RECORD PANEL -->
<div id="recordPanel">
  <div class="panel-header">
    <span class="panel-title">⏱ 기록 입력</span>
    <button class="panel-close" id="recordCloseBtn">&times;</button>
  </div>
  <div class="record-field">
    <label>Finish Time</label>
    <div class="time-inputs">
      <input type="number" id="timeH" min="0" max="23" placeholder="H" inputmode="numeric">
      <span class="sep">:</span>
      <input type="number" id="timeM" min="0" max="59" placeholder="MM" inputmode="numeric">
      <span class="sep">:</span>
      <input type="number" id="timeS" min="0" max="59" placeholder="SS" inputmode="numeric">
    </div>
  </div>
  <div class="record-field">
    <label>종목</label>
    <select id="recordCategory">
      <option value="개인전">개인전</option>
      <option value="3인팀전">3인팀전</option>
      <option value="혼성릴레이">혼성릴레이</option>
    </select>
  </div>
  <div class="record-field">
    <label>이름</label>
    <input type="text" id="recordName" placeholder="참가자 이름">
  </div>
  <div class="record-actions">
    <button id="recordClearBtn">초기화</button>
    <button id="recordApplyBtn">확인</button>
  </div>
</div>

<!-- REVIEW -->
<div id="reviewScreen">
  <img id="reviewImage" alt="Captured">
  <div class="review-tools">
    <button class="review-chip frame-chip active" data-frame="ribbon">RIBBON</button>
    <button class="review-chip frame-chip" data-frame="sport">SPORT</button>
    <button class="review-chip frame-chip" data-frame="minimal">MINIMAL</button>
    <button class="review-chip frame-chip" data-frame="dark">DARK</button>
    <button class="review-chip" id="reviewRecordBtn">✎ 기록 수정</button>
  </div>
  <div class="review-actions">
    <button class="review-btn retake" id="retakeBtn">RETAKE</button>
    <button class="review-btn download-btn" id="downloadBtn">↓ SAVE</button>
    <button class="review-btn share-save" id="shareBtn">SHARE ↑</button>
  </div>
</div>

<canvas id="exportCanvas"></canvas>

<script>
/* Isolated on purpose: a browser too old for dynamic-import syntax only loses
   this block, and the app falls back to the legacy segmenter. */

function loadImage(src) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.onload = function() { resolve(img); };
    img.onerror = function() { reject(new Error('Failed to load ' + src)); };
    img.src = src;
  });
}

function loadAllFrames() {
  var jobs = Object.keys(FRAME_DEFS).map(function(key) {
    var def = FRAME_DEFS[key];
    if (def.type !== 'box') return Promise.resolve();
    var parts = [loadImage(def.plate)];
    parts.push(def.fg ? loadImage(def.fg.src) : Promise.resolve(null));
    return Promise.all(parts).then(function(res) {
      frameAssets[key] = { plate: res[0], fg: res[1] };
    });
  });
  // brand marks for the overlay filters, one tint per variant
  Object.keys(OVERLAY_INK).forEach(function(variant) {
    var ink = OVERLAY_INK[variant];
    jobs.push(Promise.all([svgToImg(WM_SVG, ink), svgToImg(ICON_SVG, ink)])
      .then(function(res) { svgMarks[variant] = { wm: res[0], icon: res[1] }; }));
  });
  return Promise.all(jobs);
}

function loadFonts() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  return Promise.all([
    document.fonts.load('800 40px "Manrope"'),
    document.fonts.load('700 30px "Noto Sans KR"'),
    document.fonts.load('400 40px "DM Serif Display"'),
    document.fonts.load('italic 400 40px "DM Serif Display"')

function doShutterCountdown(seconds) {
  return new Promise(function(resolve) {
    shutterCountingDown = true;
    shutterCountdown.style.display = 'flex';
    var remaining = seconds;
    function showNum() {
      countdownNum.textContent = remaining;
      countdownNum.style.animation = 'none';
      void countdownNum.offsetHeight;
      countdownNum.style.animation = 'countPulse 0.8s ease-out';
    }
    showNum();
    var iv = setInterval(function() {
      remaining--;
      if (remaining <= 0) {
        clearInterval(iv);
        shutterCountdown.style.display = 'none';
        shutterCountingDown = false;
        resolve();
      } else {
        showNum();
      }
    }, 1000);
  });
}

/* ══════════════════════════════════════════
   MASK REFINEMENT

   Runs at MASK_W instead of full camera resolution: the model only emits a
   256px-wide mask, so the extra pixels carry no information and the per-pixel
   JS loop is what costs frames on a phone.
══════════════════════════════════════════ */
function refineMask(rawMask, aspect) {
  var mw = MASK_W;
  var mh = Math.max(1, Math.round(MASK_W / aspect));

  if (maskCanvas.width !== mw || maskCanvas.height !== mh) {
    maskCanvas.width = mw; maskCanvas.height = mh;
    blurCanvas.width = mw; blurCanvas.height = mh;
  }

  maskCtx.clearRect(0, 0, mw, mh);
  maskCtx.drawImage(rawMask, 0, 0, mw, mh);

  var imageData = maskCtx.getImageData(0, 0, mw, mh);
  var data = imageData.data;
  var span = MASK_HI - MASK_LO;
  var minX = mw, minY = mh, maxX = -1, maxY = -1;
  for (var i = 3; i < data.length; i += 4) {
    var a = data[i];
    if (a >= MASK_HI) data[i] = 255;
    else if (a <= MASK_LO) data[i] = 0;
    else data[i] = ((a - MASK_LO) / span * 255) | 0;
    if (data[i] > 127) {
      var p = i >> 2, x = p % mw, y = (p / mw) | 0;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  maskCtx.putImageData(imageData, 0, 0);

  // person bounding box — anything shorter than ~12% of the frame is noise
  lastMaskBox = (maxY - minY) > mh * 0.12
    ? { x0: minX / mw, y0: minY / mh, x1: (maxX + 1) / mw, y1: (maxY + 1) / mh }
    : null;

  if (!CTX_FILTER_OK) return maskCanvas;

  // soften the cut so the silhouette does not look die-cut
  blurCtx.clearRect(0, 0, mw, mh);
  blurCtx.filter = 'blur(1px)';
  blurCtx.drawImage(maskCanvas, 0, 0);
  blurCtx.filter = 'none';
  return blurCanvas;
}

/* Tasks-segmenter mask: float background-confidence → person alpha.
   EMA over time, then a high smoothstep band — a crisp anti-aliased edge that
   also sheds the background-colour fringe. */
function refineTaskMask(mpMask) {
  var mw = mpMask.width, mh = mpMask.height;
  var f = mpMask.getAsFloat32Array();   // confidence of BACKGROUND (category 0)

  var first = !maskEMA || maskEMA.length !== f.length;
  if (first) maskEMA = new Float32Array(f.length);

  if (maskCanvas.width !== mw || maskCanvas.height !== mh) {
    maskCanvas.width = mw; maskCanvas.height = mh;
    blurCanvas.width = mw; blurCanvas.height = mh;
  }

  var imageData = maskCtx.createImageData(mw, mh);
  var data = imageData.data;
  var span = TASK_HI - TASK_LO;
  var minX = mw, minY = mh, maxX = -1, maxY = -1;

  for (var i = 0; i < f.length; i++) {
    var v = 1 - f[i];
    var e = first ? v : maskEMA[i] + (v - maskEMA[i]) * EMA_NEW;
    maskEMA[i] = e;
    var t = (e - TASK_LO) / span;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    t = t * t * (3 - 2 * t);            // smoothstep
    var a = (t * 255) | 0;
    data[(i << 2) + 3] = a;
    if (a > 127) {
      var x = i % mw, y = (i / mw) | 0;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  maskCtx.putImageData(imageData, 0, 0);

  lastMaskBox = (maxY - minY) > mh * 0.12
    ? { x0: minX / mw, y0: minY / mh, x1: (maxX + 1) / mw, y1: (maxY + 1) / mh }
    : null;

  if (!CTX_FILTER_OK) return maskCanvas;
  blurCtx.clearRect(0, 0, mw, mh);
  blurCtx.filter = 'blur(1px)';
  blurCtx.drawImage(maskCanvas, 0, 0);
  blurCtx.filter = 'none';
  return blurCanvas;
}

/* ══════════════════════════════════════════
   PERSON LAYER
══════════════════════════════════════════ */
/* `mask` is a ready-to-composite alpha canvas (from refineMask/refineTaskMask),
   or null for the raw-video fallback. */
function buildPersonLayer(image, mask) {
  var vw = image.width  || video.videoWidth;
  var vh = image.height || video.videoHeight;
  if (!vw || !vh) return false;

  if (personCanvas.width !== vw || personCanvas.height !== vh) {
    personCanvas.width = vw; personCanvas.height = vh;
  }

  // keep the plain frame too, for the overlay filters
  if (rawCanvas.width !== vw || rawCanvas.height !== vh) {
    rawCanvas.width = vw; rawCanvas.height = vh;
  }
  rawCtx.setTransform(1, 0, 0, 1, 0, 0);
  if (isFront) rawCtx.setTransform(-1, 0, 0, 1, vw, 0);
  rawCtx.drawImage(image, 0, 0, vw, vh);
  rawCtx.setTransform(1, 0, 0, 1, 0, 0);

  personCtx.setTransform(1, 0, 0, 1, 0, 0);
  personCtx.globalCompositeOperation = 'source-over';
  personCtx.clearRect(0, 0, vw, vh);

  // front camera is mirrored so the preview behaves like a mirror
  if (isFront) personCtx.setTransform(-1, 0, 0, 1, vw, 0);

  if (mask) {
    personCtx.drawImage(mask, 0, 0, vw, vh);
    personCtx.globalCompositeOperation = 'source-in';
  }
  personCtx.drawImage(image, 0, 0, vw, vh);

  personCtx.setTransform(1, 0, 0, 1, 0, 0);
  personCtx.globalCompositeOperation = 'source-over';
  personReady = true;

  // smooth the detected box over time so the framing doesn't wobble
  var raw = (mask && lastMaskBox)
    ? { x0: lastMaskBox.x0, y0: lastMaskBox.y0, x1: lastMaskBox.x1, y1: lastMaskBox.y1, mirrored: isFront }
    : null;
  if (raw && personBox && personBox.mirrored === raw.mirrored) {
    var k = 0.3;
    personBox = {
      x0: personBox.x0 + (raw.x0 - personBox.x0) * k,
      y0: personBox.y0 + (raw.y0 - personBox.y0) * k,
      x1: personBox.x1 + (raw.x1 - personBox.x1) * k,
      y1: personBox.y1 + (raw.y1 - personBox.y1) * k,
      mirrored: raw.mirrored
    };
  } else {
    personBox = raw;
  }
  return true;
}

/* ══════════════════════════════════════════
   COMPOSITE

   Frame art is the background; the person is drawn on top, clipped to the
   inside of the box. Nothing is ever cut out of the artwork.
══════════════════════════════════════════ */
/* Fits the cutout into the stage rect and softens the vertical edges, so an arm
   that runs past the inside of the box fades out instead of being sliced. The
   bottom stays a hard cut — that is the floor line the person stands on. */
var SIDE_FADE = 0.055;

// contain-fit margin, used only when no person is detected (raw-video fallback)
var PERSON_FIT = 0.92;

// with a detected person, the shot is normalised by their mask bounding box so
// everyone lands at the same size regardless of how the photo was framed
var PERSON_H  = 0.80;  // person height as a fraction of stage height
var PERSON_W  = 0.88;  // cap: person width as a fraction of stage width
var MAX_ZOOM  = 2.2;   // cap: drawn frame height ≤ this × stage height (far-away person)

function buildStageLayer(person, box, sw, sh) {
  if (stageCanvas.width !== sw || stageCanvas.height !== sh) {
    stageCanvas.width = sw; stageCanvas.height = sh;
  }
  var c = stageCtx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'source-over';
  c.clearRect(0, 0, sw, sh);

  var scale, dx, dy;
  if (box) {
    // size by the person, not the camera frame: their bbox height lands at
    // PERSON_H of the stage whatever the framing of the shot was
    var bh = (box.y1 - box.y0) * person.height;
    var bw = (box.x1 - box.x0) * person.width;
    scale = Math.min(PERSON_H * sh / bh, PERSON_W * sw / bw, MAX_ZOOM * sh / person.height);
    var dwB = person.width * scale, dhB = person.height * scale;
    // the person canvas may be mirrored; the box was measured on the raw mask
    var cx = (box.x0 + box.x1) / 2;
    if (box.mirrored) cx = 1 - cx;
    dx = sw / 2 - cx * dwB;          // person centred in the box
    dy = sh - box.y1 * dhB;          // person bottom on the box floor
    c.drawImage(person, dx, dy, dwB, dhB);
  } else {
    // no detection — contain-fit the whole frame, standing on the floor
    scale = PERSON_FIT * Math.min(sw / person.width, sh / person.height);
    var dw = person.width * scale, dh = person.height * scale;
    c.drawImage(person, (sw - dw) / 2, sh - dh, dw, dh);
  }

  c.globalCompositeOperation = 'destination-in';
  var g = c.createLinearGradient(0, 0, sw, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(SIDE_FADE, 'rgba(0,0,0,1)');
  g.addColorStop(1 - SIDE_FADE, 'rgba(0,0,0,1)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, sw, sh);
  c.globalCompositeOperation = 'source-over';

  return stageCanvas;
}

/* ── MAGAZINE OVERLAYS (the original filters): full photo, type on top.
   Drawn in a fixed 1080×1920 space and scaled to the target canvas. ── */
function drawMagazine(ctx, W, H, variant, raw) {
  var ink = OVERLAY_INK[variant];
  var marks = svgMarks[variant] || {};
  var lc = variant === 'dark' ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.22)';
  var rc = variant === 'dark' ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.18)';

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(W / 1080, H / 1920);
  W = 1080; H = 1920;

  // photo, cover-cropped (rawCanvas is already mirrored)
  if (raw && raw.width) {
    var va = raw.width / raw.height, ca = W / H, sx, sy, sw, sh;
    if (va > ca) { sh = raw.height; sw = sh * ca; sx = (raw.width - sw) / 2; sy = 0; }
    else { sw = raw.width; sh = sw / ca; sx = 0; sy = (raw.height - sh) / 2; }
    ctx.drawImage(raw, sx, sy, sw, sh, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#dddddd';
    ctx.fillRect(0, 0, W, H);
  }

  // wash
  if (variant === 'minimal') {
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(0, 0, W, H);
  } else {
    var g1 = ctx.createRadialGradient(W/2, H/2, H*0.15, W/2, H/2, H*0.72);
    g1.addColorStop(0, 'rgba(0,0,0,0.03)');
    g1.addColorStop(1, 'rgba(0,0,0,0.58)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);
  }

  var px = 72;
  function hline(x1, y, x2) { ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke(); }

  // top rule + wordmark + labels
  ctx.strokeStyle = rc; ctx.lineWidth = 1.5;
  hline(px, 110, W - px);

  var py = 155;
  if (marks.wm) {
    var wmW = 640, wmH = wmW * (33/226);
    ctx.drawImage(marks.wm, (W - wmW)/2, py, wmW, wmH);
    py += wmH;
  }

  py += 16;
  ctx.fillStyle = ink; ctx.globalAlpha = 0.72;
  ctx.font = '700 40px ' + MANROPE;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('R E X T R E M E', W/2, py);
  ctx.globalAlpha = 1;
  py += 50;

  ctx.strokeStyle = lc; ctx.lineWidth = 1.5;
  hline((W - 500)/2, py, (W + 500)/2);
  py += 22;

  ctx.fillStyle = ink; ctx.globalAlpha = 0.62;
  ctx.font = 'italic 400 36px ' + SERIF;
  ctx.fillText('2026. 08. 01 · 수원컨벤션센터', W/2, py);
  ctx.globalAlpha = 1;
  py += 60;

  // tagline
  var tagY = py + 10;
  if (variant === 'dark') { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 18; }
  ctx.fillStyle = ink;
  ctx.font = '800 118px ' + MANROPE;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('RUN.', px, tagY);
  ctx.fillText('YOUR.', px, tagY + 140);
  ctx.fillText('CITY.', px, tagY + 280);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  // right info: record or date
  ctx.textAlign = 'right';
  if (variant === 'dark') { ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12; }
  if (record.time) {
    ctx.fillStyle = ink; ctx.font = '900 84px ' + MANROPE;
    ctx.fillText(record.time, W - px, tagY + 18);
    ctx.font = '700 40px ' + KRSANS;
    ctx.fillText(record.category, W - px, tagY + 122);
    if (record.name) {
      ctx.font = '600 38px ' + KRSANS; ctx.globalAlpha = 0.78;
      ctx.fillText(record.name, W - px, tagY + 185);
      ctx.globalAlpha = 1;
    }
    ctx.font = '700 46px ' + MANROPE; ctx.globalAlpha = 0.72;
    ctx.fillText('2026.08.01', W - px, tagY + 380);
    ctx.font = '500 36px ' + KRSANS; ctx.globalAlpha = 0.56;
    ctx.fillText('수원컨벤션센터', W - px, tagY + 442);
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = ink; ctx.font = '700 52px ' + MANROPE; ctx.globalAlpha = 0.72;
    ctx.fillText('2026.08.01', W - px, tagY + 370);
    ctx.font = '500 40px ' + KRSANS; ctx.globalAlpha = 0.55;
    ctx.fillText('수원컨벤션센터', W - px, tagY + 436);
    ctx.globalAlpha = 1;
  }
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  // bottom section
  var botBase = H - 480;
  ctx.strokeStyle = lc; ctx.lineWidth = 1.5;
  hline(px, botBase, px + 340);
  botBase += 38;

  ctx.fillStyle = ink; ctx.globalAlpha = 0.72;
  ctx.font = 'italic 400 46px ' + SERIF;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('The bridge between', px, botBase);
  ctx.fillText('you and the road.', px, botBase + 60);
  ctx.globalAlpha = 1;
  botBase += 138;

  ctx.fillStyle = ink; ctx.globalAlpha = 0.45;
  ctx.font = '500 26px ' + KRSANS;
  ctx.fillText('#DARIMATI  #REXTREME  #렉스트림  #다리마티', px, botBase);
  ctx.globalAlpha = 1;

  // logo row
  var logoY = H - 110;
  if (marks.wm) {
    var lW = 300, lH = lW * (33/226);
    ctx.drawImage(marks.wm, px, logoY - lH, lW, lH);
  }
  ctx.fillStyle = ink; ctx.globalAlpha = 0.7;
  ctx.font = '400 28px ' + KRSANS; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('다리마티', px, logoY + 4);
  ctx.globalAlpha = 1;
  if (marks.icon) {
    ctx.globalAlpha = 0.75;
    ctx.drawImage(marks.icon, W - px - 72, logoY - 54, 72, 72);
    ctx.globalAlpha = 1;
  }

  ctx.strokeStyle = rc; ctx.lineWidth = 1.5;
  hline(px, H - 38, W - px);

  ctx.restore();
}

function drawComposite(ctx, W, H, key, plate, person, box, raw) {
  var def = FRAME_DEFS[key];
  var assets = frameAssets[key] || {};

  if (def.type === 'overlay') {
    drawMagazine(ctx, W, H, def.variant, raw);
    return;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (plate) {
    ctx.drawImage(plate, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  }

  if (person && person.width) {
    var st = def.stage;
    var sx = Math.round(st.x * W), sy = Math.round(st.y * H);
    var sw = Math.round(st.w * W), sh = Math.round(st.h * H);
    var layer = buildStageLayer(person, box, sw, sh);

    ctx.save();
    ctx.beginPath();
    ctx.rect(sx, sy, sw, sh);
    ctx.clip();

    // lift the cutout off the back wall
    ctx.shadowColor = 'rgba(0,0,0,0.30)';
    ctx.shadowBlur = H * 0.014;
    ctx.shadowOffsetY = H * 0.005;
    ctx.drawImage(layer, sx, sy);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    // redraw crisp on top of its own shadow
    ctx.drawImage(layer, sx, sy);

    ctx.restore();
  }

  if (def.fg && assets.fg) {
    ctx.drawImage(assets.fg, def.fg.x * W, def.fg.y * H, def.fg.w * W, def.fg.h * H);
  }

  drawRecord(ctx, W, H, def);
}

function fitFont(ctx, text, weight, family, sizePx, maxW) {
  var size = sizePx;
  ctx.font = weight + ' ' + size + 'px ' + family;
  while (size > 8 && ctx.measureText(text).width > maxW) {
    size -= 0.5;
    ctx.font = weight + ' ' + size + 'px ' + family;
  }
}

function drawRecord(ctx, W, H, def) {
  var r = def.record;
  var ax = r.align * W;

  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';

  if (record.time) {
    ctx.fillStyle = r.time.color;
    ctx.font = '800 ' + (r.time.size * H) + 'px ' + MANROPE;
    ctx.fillText(record.time, ax, r.time.y * H);
  }

  var line = record.category || '';
  if (record.name) line = line ? line + '  ·  ' + record.name : record.name;
  if (line) {
    ctx.fillStyle = r.cat.color;
    fitFont(ctx, line, '700', KRSANS, r.cat.size * H, r.cat.maxW * W);
    ctx.fillText(line, ax, r.cat.y * H);
  }
}

/* ══════════════════════════════════════════
   PREVIEW
══════════════════════════════════════════ */
function sizePreviewCanvas() {
  var def = FRAME_DEFS[currentFrame];
  var scale = PREVIEW_LONG_EDGE / Math.max(def.w, def.h);
  var w = Math.round(def.w * scale), h = Math.round(def.h * scale);
  if (displayCanvas.width !== w || displayCanvas.height !== h) {
    displayCanvas.width = w;
    displayCanvas.height = h;
  }
}

/* The plate never changes, so scale it once per frame size instead of
   re-scaling a ~1500px JPEG on every preview frame. */
var previewPlates = {};

function previewPlate(key, W, H) {
  var cached = previewPlates[key];
  if (cached && cached.width === W && cached.height === H) return cached;
  var assets = frameAssets[key];
  if (!assets || !assets.plate) return null;
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  c.getContext('2d').drawImage(assets.plate, 0, 0, W, H);
  previewPlates[key] = c;
  return c;
}

function renderPreview() {
  var W = displayCanvas.width, H = displayCanvas.height;
  drawComposite(displayCtx, W, H, currentFrame, previewPlate(currentFrame, W, H),
                personReady ? personCanvas : null, personBox,
                personReady ? rawCanvas : null);
}

/* ══════════════════════════════════════════
   EXPORT — rendered at the frame's native resolution
══════════════════════════════════════════ */
function renderExport(person, box, raw) {
  var def = FRAME_DEFS[currentFrame];
  var assets = frameAssets[currentFrame] || {};
  exportCanvas.width = def.w;
  exportCanvas.height = def.h;
  drawComposite(exportCtx, def.w, def.h, currentFrame, assets.plate || null, person, box, raw);
}

/* Freeze the current cutout (and its box) so review-screen edits keep
   re-compositing the same shot instead of whatever the camera sees now. */
function snapshotPerson() {
  if (!personReady || !personCanvas.width) return null;
  capturedPerson.width = personCanvas.width;
  capturedPerson.height = personCanvas.height;
  capturedPersonCtx.drawImage(personCanvas, 0, 0);
  if (rawCanvas.width) {
    capturedRaw.width = rawCanvas.width;
    capturedRaw.height = rawCanvas.height;
    capturedRawCtx.drawImage(rawCanvas, 0, 0);
  }
  capturedPersonBox = personBox;
  return capturedPerson;
}

/* ══════════════════════════════════════════
   CAMERA STREAM

   The stream is owned here rather than by MediaPipe's camera_utils helper: it
   keeps permission errors reportable on the landing screen, makes the camera
   flip a single call, and lets the app still run — plain video inside the box —
   when the segmentation model cannot be fetched.
══════════════════════════════════════════ */
function openStream() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return Promise.reject(new Error('NoMediaDevices'));
  }
  if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
  return navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode, width:{ ideal:720 }, height:{ ideal:960 } },
    audio: false
  }).then(function(s) {
    stream = s;
    isFront = facingMode === 'user';
    maskEMA = null;      // stale mask/box would ghost across a camera flip
    personBox = null;
    video.srcObject = s;
    return video.play();
  }).then(function() {
    if (video.videoWidth) return;
    return new Promise(function(resolve) {
      video.addEventListener('loadedmetadata', function onMeta() {
        video.removeEventListener('loadedmetadata', onMeta);
        resolve();
      });
    });
  });
}

function loadScript(src) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.onload = resolve;
    s.onerror = function() { reject(new Error('failed to load ' + src)); };
    s.src = src;
    document.head.appendChild(s);
  });
}

function initTasksSegmenter(delegate) {
  return window.__importModule(TASKS_VISION + '/+esm').then(function(mod) {
    return mod.FilesetResolver.forVisionTasks(TASKS_VISION + '/wasm').then(function(fileset) {
      return mod.ImageSegmenter.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: TASKS_MODEL, delegate: delegate },
        runningMode: 'VIDEO',
        outputConfidenceMasks: true,
        outputCategoryMask: false
      });
    });
  });
}

function initLegacySegmenter() {
  selfieSegmentation = new SelfieSegmentation({
    locateFile: function(file) {
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/' + file;
    }
  });
  // 0 = general (256×256) — better vertical detail for portrait selfies than the
  // landscape model. Mirroring is handled in buildPersonLayer, not here.
  selfieSegmentation.setOptions({ modelSelection: 0, selfieMode: false });
  selfieSegmentation.onResults(function(results) {
    if (legacyStillCb) {
      var cb = legacyStillCb;
      legacyStillCb = null;
      cb(results.segmentationMask);
      return;
    }
    var img = results.image;
    var aspect = (img.width || video.videoWidth) / (img.height || video.videoHeight || 1);
    buildPersonLayer(img, refineMask(results.segmentationMask, aspect));
    renderPreview();
    flushCapture();
  });
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise(function(_, reject) {
    setTimeout(function() { reject(new Error('timeout after ' + ms + 'ms')); }, ms);
  })]);
}

/* Newest first: the multiclass Tasks segmenter (hair/skin/clothes classes →
   far cleaner edges), then the 2021 selfie model, then raw video. The frame
   loop runs from the start, so the camera shows immediately and the cutout
   pops in when a model becomes ready. */
async function initSegmentation() {
  if (segForce === 'none') { console.info('[seg] forced: none'); return; }
  if (segForce !== 'legacy' && window.__importModule) {
    try {
      taskSegmenter = await withTimeout(initTasksSegmenter('GPU'), 12000);
      segMode = 'tasks';
      console.info('[seg] mode: tasks (GPU)');
      return;
    } catch (err) { console.warn('[seg] tasks GPU failed', err); }
    try {
      taskSegmenter = await withTimeout(initTasksSegmenter('CPU'), 12000);
      segMode = 'tasks';
      console.info('[seg] mode: tasks (CPU)');
      return;
    } catch (err) { console.warn('[seg] tasks CPU failed', err); }
  }
  try {
    if (typeof SelfieSegmentation === 'undefined') await loadScript(LEGACY_SEG);
    initLegacySegmenter();
    segMode = 'legacy';
    console.info('[seg] mode: legacy');
  } catch (err) {
    console.warn('[seg] all segmenters failed — raw video', err);
    segMode = 'none';
  }
}

/* A runtime failure of the Tasks segmenter must cost the cutout QUALITY, not
   the cutout itself — drop to the legacy model, never straight to raw video. */
function demoteFromTasks(err) {
  if (demoting) return;
  demoting = true;
  console.warn('[seg] tasks failed at runtime — demoting to legacy', err);
  try { if (taskSegmenter) taskSegmenter.close(); } catch (e) {}
  taskSegmenter = null;
  maskEMA = null;
  segMode = 'none';   // raw video only while legacy loads
  var load = (typeof SelfieSegmentation === 'undefined')
    ? loadScript(LEGACY_SEG) : Promise.resolve();
  load.then(function() {
    initLegacySegmenter();
    segMode = 'legacy';
    console.info('[seg] mode: legacy (demoted)');
  }).catch(function(e) {
    console.warn('[seg] legacy unavailable — raw video', e);
    selfieSegmentation = null;
    segMode = 'none';
  });
}

function onTaskResult(result) {
  var masks = result.confidenceMasks;
  if (!masks || !masks[0]) return;
  buildPersonLayer(video, refineTaskMask(masks[0]));
  renderPreview();
  flushCapture();

  // model runs but never finds anyone → the legacy model may do better on
  // this device; an actually-empty scene loses nothing by switching
  if (!lastMaskBox) {
    if (++emptyStreak > 150) demoteFromTasks(new Error('empty mask for ~150 frames'));
  } else {
    emptyStreak = 0;
  }
}

function startFrameLoop() {
  var warmedUp = false;
  async function tick() {
    if (video.readyState >= 2 && !hqBusy) {
      if (segMode === 'tasks' && taskSegmenter) {
        try {
          // iOS coarsens performance.now() to 1ms, so two frames can read the
          // same clock value — segmentForVideo throws unless we keep the
          // timestamps strictly increasing ourselves
          var ts = Math.max(lastVideoTs + 1, performance.now());
          lastVideoTs = ts;
          // callback form: the result is only valid inside the callback and is
          // freed automatically afterwards
          taskSegmenter.segmentForVideo(video, ts, onTaskResult);
        } catch (err) {
          demoteFromTasks(err);
        }
      } else if (segMode === 'legacy' && selfieSegmentation) {
        try {
          await selfieSegmentation.send({ image: video });
        } catch (err) {
          console.error('[seg] legacy failed at runtime — raw video', err);
          selfieSegmentation = null; segMode = 'none';
        }
      } else {
        buildPersonLayer(video, null);
        renderPreview();
        flushCapture();
      }
      if (!warmedUp) { warmedUp = true; segLoading.style.display = 'none'; }
    }
    requestAnimationFrame(tick);
  }
  tick();
}

function flushCapture() {
  if (!pendingCapture) return;
  var done = pendingCapture;
  pendingCapture = null;
  renderExport(snapshotPerson(), capturedPersonBox, capturedRaw.width ? capturedRaw : null);
  done();
}

/* ══════════════════════════════════════════
   CAPTURE-TIME REFINEMENT

   The live preview has to run in real time, so its mask is coarse. The still
   has no such budget: re-segment the frozen frame, run the model again on a
   person-crop (the model sees the person larger → tighter boundary), then
   snap the mask to real image edges with a guided filter.
══════════════════════════════════════════ */
var HQ_LO = 0.38, HQ_HI = 0.80;

function segmentStill(source) {
  if (segMode === 'tasks' && taskSegmenter) {
    return new Promise(function(resolve, reject) {
      try {
        var ts = Math.max(lastVideoTs + 1, performance.now());
        lastVideoTs = ts;
        taskSegmenter.segmentForVideo(source, ts, function(result) {
          var m = result.confidenceMasks && result.confidenceMasks[0];
          if (!m) { resolve(null); return; }
          var bg = m.getAsFloat32Array();
          var f = new Float32Array(bg.length);       // person = 1 − background
          for (var i = 0; i < bg.length; i++) f[i] = 1 - bg[i];
          resolve({ f: f, w: m.width, h: m.height });
        });
      } catch (e) { reject(e); }
    });
  }
  if (segMode === 'legacy' && selfieSegmentation) {
    return new Promise(function(resolve, reject) {
      legacyStillCb = function(mask) {
        var mw = mask.width || 256, mh = mask.height || 256;
        var c = document.createElement('canvas');
        c.width = mw; c.height = mh;
        var cx = c.getContext('2d');
        cx.drawImage(mask, 0, 0);
        var d = cx.getImageData(0, 0, mw, mh).data;
        var f = new Float32Array(mw * mh);
        for (var i = 0; i < f.length; i++) f[i] = d[(i << 2) + 3] / 255;
        resolve({ f: f, w: mw, h: mh });
      };
      selfieSegmentation.send({ image: source }).catch(function(e) {
        legacyStillCb = null;
        reject(e);
      });
    });
  }
  return Promise.resolve(null);
}

function floatToAlphaCanvas(f, w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var cx = c.getContext('2d');
  var id = cx.createImageData(w, h);
  for (var i = 0; i < f.length; i++) {
    var v = f[i];
    id.data[(i << 2) + 3] = (v <= 0 ? 0 : v >= 1 ? 255 : v * 255) | 0;
  }
  cx.putImageData(id, 0, 0);
  return c;
}

/* GPU-bilinear resample of an alpha canvas, read back as floats */
function alphaAtSize(srcCanvas, W, H) {
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var cx = c.getContext('2d');
  cx.drawImage(srcCanvas, 0, 0, W, H);
  var d = cx.getImageData(0, 0, W, H).data;
  var out = new Float32Array(W * H);
  for (var i = 0; i < out.length; i++) out[i] = d[(i << 2) + 3] / 255;
  return out;
}

/* normalized box blur, separable running sum, clamped edges */
function boxPass(src, dst, w, h, r, horizontal) {
  var win = 2 * r + 1;
  if (horizontal) {
    for (var y = 0; y < h; y++) {
      var row = y * w, sum = 0, x;
      for (x = -r; x <= r; x++) sum += src[row + (x < 0 ? 0 : x >= w ? w - 1 : x)];
      for (x = 0; x < w; x++) {
        dst[row + x] = sum / win;
        var add = x + r + 1; if (add >= w) add = w - 1;
        var sub = x - r; if (sub < 0) sub = 0;
        sum += src[row + add] - src[row + sub];
      }
    }
  } else {
    for (var x2 = 0; x2 < w; x2++) {
      var sum2 = 0, y2;
      for (y2 = -r; y2 <= r; y2++) sum2 += src[(y2 < 0 ? 0 : y2 >= h ? h - 1 : y2) * w + x2];
      for (y2 = 0; y2 < h; y2++) {
        dst[y2 * w + x2] = sum2 / win;
        var add2 = y2 + r + 1; if (add2 >= h) add2 = h - 1;
        var sub2 = y2 - r; if (sub2 < 0) sub2 = 0;
        sum2 += src[add2 * w + x2] - src[sub2 * w + x2];
      }
    }
  }
}

function boxBlur(src, dst, tmp, w, h, r) {
  boxPass(src, tmp, w, h, r, true);
  boxPass(tmp, dst, w, h, r, false);
}

/* He et al. guided filter: refine alpha `p` guided by grayscale image `I` —
   the mask edge snaps to the real hair/shoulder boundary. */
function guidedFilter(I, p, w, h, r, eps) {
  var n = w * h, i;
  var tmp = new Float32Array(n);
  var mI = new Float32Array(n), mP = new Float32Array(n);
  boxBlur(I, mI, tmp, w, h, r);
  boxBlur(p, mP, tmp, w, h, r);

  var Ip = new Float32Array(n), II = new Float32Array(n);
  for (i = 0; i < n; i++) { Ip[i] = I[i] * p[i]; II[i] = I[i] * I[i]; }
  var mIp = new Float32Array(n), mII = new Float32Array(n);
  boxBlur(Ip, mIp, tmp, w, h, r);
  boxBlur(II, mII, tmp, w, h, r);

  var a = Ip, b = II;   // reuse
  for (i = 0; i < n; i++) {
    var varI = mII[i] - mI[i] * mI[i];
    a[i] = (mIp[i] - mI[i] * mP[i]) / (varI + eps);
    b[i] = mP[i] - a[i] * mI[i];
  }
  boxBlur(a, mI, tmp, w, h, r);   // meanA into mI
  boxBlur(b, mP, tmp, w, h, r);   // meanB into mP
  var q = a;
  for (i = 0; i < n; i++) q[i] = mI[i] * I[i] + mP[i];
  return q;
}

function bboxOfFloat(f, w, h, thr) {
  var minX = w, minY = h, maxX = -1, maxY = -1;
  for (var i = 0; i < f.length; i++) {
    if (f[i] > thr) {
      var x = i % w, y = (i / w) | 0;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  return maxY > minY ? { x0: minX, y0: minY, x1: maxX + 1, y1: maxY + 1 } : null;
}

async function captureHQ() {
  if (DEMO || !capturedRaw.width) return;
  if (segMode !== 'tasks' && segMode !== 'legacy') return;
  hqBusy = true;
  try {
    var raw = capturedRaw, W = raw.width, H = raw.height;

    // pass 1: whole still (no temporal smoothing — single clean frame)
    var m1 = await segmentStill(raw);
    if (!m1) return;
    var alpha = alphaAtSize(floatToAlphaCanvas(m1.f, m1.w, m1.h), W, H);

    // pass 2: person crop — effectively higher mask resolution on the person
    var bb = bboxOfFloat(m1.f, m1.w, m1.h, 0.5);
    if (bb) {
      var mx = Math.round((bb.x1 - bb.x0) * 0.12), my = Math.round((bb.y1 - bb.y0) * 0.12);
      var cx0 = Math.max(0, Math.round((bb.x0 - mx) / m1.w * W));
      var cy0 = Math.max(0, Math.round((bb.y0 - my) / m1.h * H));
      var cx1 = Math.min(W, Math.round((bb.x1 + mx) / m1.w * W));
      var cy1 = Math.min(H, Math.round((bb.y1 + my) / m1.h * H));
      var cw = cx1 - cx0, ch = cy1 - cy0;
      if (cw > 40 && ch > 40 && cw * ch < W * H * 0.92) {
        var cropC = document.createElement('canvas');
        cropC.width = cw; cropC.height = ch;
        cropC.getContext('2d').drawImage(raw, cx0, cy0, cw, ch, 0, 0, cw, ch);
        var m2 = await segmentStill(cropC);
        if (m2) {
          var cropA = alphaAtSize(floatToAlphaCanvas(m2.f, m2.w, m2.h), cw, ch);
          // feathered paste so the crop border never shows
          var fx = Math.max(8, cw * 0.06), fy = Math.max(8, ch * 0.06);
          for (var y = 0; y < ch; y++) {
            var wy = Math.min(1, Math.min(y, ch - 1 - y) / fy);
            for (var x = 0; x < cw; x++) {
              var wgt = wy * Math.min(1, Math.min(x, cw - 1 - x) / fx);
              var gi = (cy0 + y) * W + (cx0 + x);
              alpha[gi] = alpha[gi] * (1 - wgt) + cropA[y * cw + x] * wgt;
            }
          }
        }
      }
    }

    // pass 3: snap to image edges
    var id = capturedRawCtx.getImageData(0, 0, W, H).data;
    var gray = new Float32Array(W * H);
    for (var i = 0; i < gray.length; i++) {
      var j = i << 2;
      gray[i] = (id[j] * 0.299 + id[j + 1] * 0.587 + id[j + 2] * 0.114) / 255;
    }
    // small eps → the filter follows image edges hard, which kills the
    // colour halo where the subject and background have low contrast
    var q = guidedFilter(gray, alpha, W, H, 6, 3e-4);

    // band + bbox
    var span = HQ_HI - HQ_LO;
    var minX = W, minY = H, maxX = -1, maxY = -1;
    for (var k = 0; k < q.length; k++) {
      var t = (q[k] - HQ_LO) / span;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      t = t * t * (3 - 2 * t);
      q[k] = t;
      if (t > 0.5) {
        var xx = k % W, yy = (k / W) | 0;
        if (xx < minX) minX = xx;
        if (xx > maxX) maxX = xx;
        if (yy < minY) minY = yy;
        if (yy > maxY) maxY = yy;
      }
    }
    if (maxY <= minY) return;   // nobody found — keep the live cutout

    capturedPerson.width = W; capturedPerson.height = H;
    capturedPersonCtx.clearRect(0, 0, W, H);
    capturedPersonCtx.drawImage(floatToAlphaCanvas(q, W, H), 0, 0);
    capturedPersonCtx.globalCompositeOperation = 'source-in';
    capturedPersonCtx.drawImage(raw, 0, 0);
    capturedPersonCtx.globalCompositeOperation = 'source-over';
    // measured on the already-mirrored still, so no mirror flag
    capturedPersonBox = { x0: minX / W, y0: minY / H, x1: (maxX + 1) / W, y1: (maxY + 1) / H, mirrored: false };
  } catch (err) {
    console.warn('[seg] capture refine failed — using live cutout', err);
  } finally {
    hqBusy = false;
  }
}

/* ══════════════════════════════════════════
   DEMO — lets the composite be checked without a camera (?demo=1)
══════════════════════════════════════════ */
function buildDemoPerson() {
  var vw = 720, vh = 960;
  personCanvas.width = vw; personCanvas.height = vh;
  var c = personCtx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, vw, vh);

  var g = c.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, '#6d7480');
  g.addColorStop(1, '#2f343c');
  c.fillStyle = g;

  var cx = vw / 2;
  c.beginPath();                              // head
  c.arc(cx, vh * 0.24, vw * 0.155, 0, Math.PI * 2);
  c.fill();
  c.beginPath();                              // shoulders + torso
  c.moveTo(cx - vw * 0.135, vh * 0.40);
  c.quadraticCurveTo(cx, vh * 0.345, cx + vw * 0.135, vh * 0.40);
  c.lineTo(cx + vw * 0.30, vh * 0.62);
  c.lineTo(cx + vw * 0.26, vh);
  c.lineTo(cx - vw * 0.26, vh);
  c.lineTo(cx - vw * 0.30, vh * 0.62);
  c.closePath();
  c.fill();

  personReady = true;
  // bbox of the silhouette above (head top = 0.24·vh − 0.155·vw)
  personBox = { x0: 0.2, y0: 0.124, x1: 0.8, y1: 1, mirrored: false };

  // plain "photo" for the overlay filters: grey scene with the silhouette
  rawCanvas.width = vw; rawCanvas.height = vh;
  var bg = rawCtx.createLinearGradient(0, 0, 0, vh);
  bg.addColorStop(0, '#c9cdd2');
  bg.addColorStop(1, '#9aa0a8');
  rawCtx.fillStyle = bg;
  rawCtx.fillRect(0, 0, vw, vh);
  rawCtx.drawImage(personCanvas, 0, 0);
}

/* ══════════════════════════════════════════
   CAMERA START / FLIP
══════════════════════════════════════════ */
function cameraErrorMessage(err) {
  var name = err && err.name;
  if (name === 'NotAllowedError' || name === 'SecurityError') {
    return '카메라 권한이 거부되었습니다.<br>브라우저 설정에서 권한을 허용한 뒤 다시 시도해 주세요.';
  }
  if (name === 'NotFoundError' || name === 'OverconstrainedError') {
    return '사용할 수 있는 카메라를 찾지 못했습니다.';
  }
  if (name === 'NotReadableError') {
    return '카메라가 다른 앱에서 사용 중입니다.<br>해당 앱을 닫고 다시 시도해 주세요.';
  }
  if (err && err.message === 'NoMediaDevices') {
    return '이 환경에서는 카메라 API를 쓸 수 없습니다.<br>https 주소(배포 링크) 또는 localhost로 열어 주세요.';
  }
  return '카메라를 시작할 수 없습니다. (' + (name || 'Error') + ')';
}

function failLanding(html) {
  permMsg.innerHTML = html;
  permMsg.classList.add('error');
  startBtn.textContent = 'START CAMERA';
}

startBtn.addEventListener('click', async function() {
  startBtn.innerHTML = '<span class="loading"></span>';
  permMsg.classList.remove('error');

  try {
    await Promise.all([loadAllFrames(), loadFonts()]);
  } catch (err) {
    console.error(err);
    failLanding('프레임 이미지를 불러오지 못했습니다.<br>새로고침 후 다시 시도해 주세요.');
    return;
  }

  // Ask for the camera while the landing screen is still up, so a refusal has
  // somewhere to be reported.
  if (!DEMO) {
    try {
      await openStream();
    } catch (err) {
      console.error('Camera failed', err);
      failLanding(cameraErrorMessage(err));
      return;
    }
  }

  permScreen.style.display = 'none';
  app.style.display = 'block';
  sizePreviewCanvas();

  if (DEMO) {
    buildDemoPerson();
    renderPreview();
    return;
  }

  renderPreview();
  segLoading.style.display = 'flex';
  initSegmentation();
  startFrameLoop();
});

flipBtn.addEventListener('click', function() {
  if (DEMO || !stream) return;
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  openStream().catch(function(err) {
    console.error('Flip failed', err);
    // put the previous camera back
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    openStream().catch(function() {});
  });
});

/* ══════════════════════════════════════════
   CAPTURE
══════════════════════════════════════════ */
function nextRenderedFrame() {
  // DEMO and the no-camera case have no frame loop to wait on
  if (DEMO) {
    renderExport(snapshotPerson(), capturedPersonBox, capturedRaw.width ? capturedRaw : null);
    return Promise.resolve();
  }
  return new Promise(function(resolve) {
    pendingCapture = resolve;
    setTimeout(function() {
      if (pendingCapture === resolve) {
        pendingCapture = null;
        renderExport(snapshotPerson(), capturedPersonBox, capturedRaw.width ? capturedRaw : null);
        resolve();
      }
    }, 700);
  });
}

captureBtn.addEventListener('click', async function() {
  if (shutterCountingDown) return;
  if (shutterDelay > 0) await doShutterCountdown(shutterDelay);

  var flash = document.createElement('div');
  flash.className = 'flash';
  document.body.appendChild(flash);
  setTimeout(function(){ flash.remove(); }, 380);

  await nextRenderedFrame();
  await captureHQ();
  renderExport(capturedPerson.width ? capturedPerson : null, capturedPersonBox,
               capturedRaw.width ? capturedRaw : null);

  var gen = ++exportGen;
  var blob = await new Promise(function(res) { exportCanvas.toBlob(res, 'image/jpeg', 0.93); });
  if (!blob || gen !== exportGen) return;
  capturedBlob = blob;
  reviewImage.src = URL.createObjectURL(blob);
  reviewing = true;
  syncFrameButtons();
  reviewScreen.style.display = 'flex';
});

/* ══════════════════════════════════════════
   REVIEW-SCREEN EDITING — switch frame version or fix the record after the
   shot; the frozen cutout is re-composited each time
══════════════════════════════════════════ */
function syncFrameButtons() {
  filterBtns.forEach(function(b) { b.classList.toggle('active', b.dataset.filter === currentFrame); });
  frameChips.forEach(function(ch) { ch.classList.toggle('active', ch.dataset.frame === currentFrame); });
}

function rebuildCapture() {
  if (!reviewing) return;
  var gen = ++exportGen;
  renderExport(capturedPerson.width ? capturedPerson : null, capturedPersonBox,
               capturedRaw.width ? capturedRaw : null);
  exportCanvas.toBlob(function(blob) {
    if (!blob || !reviewing || gen !== exportGen) return;
    var old = reviewImage.src;
    capturedBlob = blob;
    reviewImage.src = URL.createObjectURL(blob);
    if (old) URL.revokeObjectURL(old);
  }, 'image/jpeg', 0.93);
}

frameChips.forEach(function(ch) {
  ch.addEventListener('click', function() {
    if (currentFrame === ch.dataset.frame) return;
    currentFrame = ch.dataset.frame;
    syncFrameButtons();
    sizePreviewCanvas();
    if (DEMO) renderPreview();
    rebuildCapture();
  });
});

reviewRecordBtn.addEventListener('click', openRecordPanel);

/* ══════════════════════════════════════════
   SHARE / DOWNLOAD
══════════════════════════════════════════ */
var FILENAME = 'DARIMATI_20260801.jpg';

shareBtn.addEventListener('click', async function() {
  if (!capturedBlob) return;
  var file = new File([capturedBlob], FILENAME, { type:'image/jpeg' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files:[file] })) {
    try { await navigator.share({ title:'DARIMATI Race Day', text:'#DARIMATI #REXTREME', files:[file] }); return; }
    catch(err) { if (err.name === 'AbortError') return; }
  }
  triggerDownload(FILENAME);
});

downloadBtn.addEventListener('click', function() {
  triggerDownload(FILENAME);
});

function triggerDownload(fname) {
  if (!capturedBlob) return;
  var url = URL.createObjectURL(capturedBlob);
  var a = document.createElement('a'); a.href = url; a.download = fname; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

retakeBtn.addEventListener('click', function() {
  reviewing = false;
  reviewScreen.style.display = 'none';
  if (capturedBlob) { URL.revokeObjectURL(reviewImage.src); capturedBlob = null; }
});

})();
</script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>DARIMATI — Race Day Filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
  --sans:"Manrope",-apple-system,BlinkMacSystemFont,sans-serif;
  --gold:#C8A44E;
}
html,body { width:100%; height:100%; overflow:hidden; background:#f0f0f0; font-family:var(--sans); touch-action:manipulation; }

/* ── LANDING ── */
#permissionScreen {
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  background:#fff; color:#111; overflow:hidden;
}
.landing-hero {
  position:relative; width:100%; height:100vh; height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:2rem; overflow:hidden; background:#fff; text-align:center;
}
.hero-brand {
  font-size:clamp(1.4rem,6vw,2rem); font-weight:800; letter-spacing:0.5em;
  color:#111; margin-bottom:0.2rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s both;
}
.hero-sub {
  font-size:0.72rem; font-weight:700; letter-spacing:0.35em; color:var(--gold);
  margin-bottom:0.4rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.4s both;
}
.hero-rule { width:48px; height:1px; background:rgba(0,0,0,0.15); margin:0.5rem auto 0.6rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
.hero-detail {
  font-size:0.68rem; font-weight:500; color:rgba(0,0,0,0.4); letter-spacing:0.18em;
  margin-bottom:2.4rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.6s both;
}
.hero-cta-area {
  display:flex; flex-direction:column; align-items:center; gap:0.8rem;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.8s both;
}
#startCameraBtn {
  background:#111; color:#fff;
  border:none; padding:1rem 3.2rem; font-size:0.78rem;
  font-weight:700; letter-spacing:0.22em;
  text-transform:uppercase; cursor:pointer; transition:all 0.15s;
}
#startCameraBtn:active { opacity:0.7; transform:scale(0.97); }
.cta-notice {
  font-size:0.6rem; color:rgba(0,0,0,0.35); line-height:1.7; max-width:260px; text-align:center;
}
.hero-bottom-mark {
  position:absolute; bottom:calc(1.5rem + var(--safe-bottom)); left:0; right:0;
  text-align:center; font-size:0.58rem; color:rgba(0,0,0,0.15); letter-spacing:0.12em; font-weight:500;
  animation:heroFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1s both;
}
#permissionScreen .msg { display:none; }
#permissionScreen .msg.error { display:block; font-size:0.82rem; color:#e74c3c; line-height:1.7; }
@keyframes heroFadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

/* ── APP ── */
#app { display:none; position:fixed; inset:0; background:#e8e8e8; }
#viewfinder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
#cameraVideo { display:none; }
#displayCanvas { width:100%; height:100%; object-fit:cover; }

/* ── SEGMENTATION LOADING ── */
#segLoading {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:15; display:none; flex-direction:column; align-items:center; gap:0.6rem;
  color:#888; font-size:0.7rem; letter-spacing:0.1em;
}

/* ── SHUTTER COUNTDOWN ── */
#shutterCountdown {
  position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
  z-index:14; display:none; align-items:center; justify-content:center;
  pointer-events:none;
}
#shutterCountdown .countdown-num {
  font-size:clamp(5rem,22vw,8rem); font-weight:900;
  color:#111; letter-spacing:0.02em;
  text-shadow:0 2px 20px rgba(255,255,255,0.7);
  animation:countPulse 0.8s ease-out;
}
@keyframes countPulse {
  0% { transform:scale(1.5); opacity:0; }
  30% { transform:scale(1); opacity:1; }
  100% { transform:scale(0.95); opacity:0.9; }
}

/* ── FILTER TOGGLE ── */
.filter-btns {
  position:absolute; top:calc(var(--safe-top) + 0.8rem); right:0.8rem; z-index:12;
  display:flex; flex-direction:column; gap:0.35rem;
}
.filter-btn {
  background:rgba(255,255,255,0.7); border:1.5px solid rgba(0,0,0,0.1);
  color:#333; padding:0.3rem 0.65rem; font-size:0.5rem;
  font-weight:700; letter-spacing:0.14em;
  cursor:pointer; transition:all 0.2s; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  pointer-events:auto;
}
.filter-btn.active { background:#111; color:#fff; border-color:#111; }
.filter-btn:active { transform:scale(0.94); }

/* ── CONTROLS ── */
#controlsBar {
  position:absolute; bottom:0; left:0; right:0; z-index:10;
  display:flex; align-items:center; justify-content:center; gap:1.2rem;
  padding:0.8rem 1.5rem; padding-bottom:calc(1rem + var(--safe-bottom));
  background:linear-gradient(to top,rgba(228,228,228,0.9) 0%,transparent 100%);
}
#captureBtn {
  width:66px; height:66px; border-radius:50%;
  border:3px solid #111; background:transparent;
  cursor:pointer; position:relative; transition:transform 0.15s;
}
#captureBtn::after {
  content:""; position:absolute; inset:4px; border-radius:50%;
  background:#111; transition:transform 0.15s;
}
#captureBtn:active { transform:scale(0.88); }
#captureBtn:active::after { transform:scale(0.84); }
.ctrl-btn {
  width:42px; height:42px; border-radius:50%; border:none;
  background:rgba(0,0,0,0.08); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  color:#333; font-size:1.1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:transform 0.3s;
  position:relative;
}
#flipBtn:active { transform:rotate(180deg); }
#recordBtn.has-data { background:#111; color:#fff; }
#shutterTimerBtn.active { background:#111; color:#fff; }
#shutterTimerBadge {
  position:absolute; top:-5px; right:-5px; min-width:16px; height:16px;
  background:var(--gold); color:#fff; border-radius:8px;
  font-size:0.46rem; font-weight:800;
  display:none; align-items:center; justify-content:center; padding:0 3px; line-height:1;
}

/* ── RECORD PANEL ── */
#recordPanel {
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:rgba(255,255,255,0.96); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border-top:1px solid rgba(0,0,0,0.08);
  padding:1.5rem 1.5rem calc(1.5rem + var(--safe-bottom));
  border-radius:18px 18px 0 0; max-height:78vh; overflow-y:auto;
  transform:translateY(100%); transition:transform 0.32s ease;
}
#recordPanel.open { display:block; transform:translateY(0); }
#recordPanel .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; }
#recordPanel .panel-title { color:#111; font-size:0.82rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; }
#recordPanel .panel-close { background:none; border:none; color:#999; font-size:1.5rem; cursor:pointer; }
.record-field { margin-bottom:0.9rem; }
.record-field label { display:block; color:#888; font-size:0.64rem; font-weight:600; letter-spacing:0.14em; margin-bottom:0.35rem; text-transform:uppercase; }
.record-field input,.record-field select {
  width:100%; background:rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.1);
  color:#111; padding:0.6rem 0.75rem; font-size:0.92rem;
  border-radius:6px; outline:none; transition:border-color 0.2s;
}
.record-field input:focus,.record-field select:focus { border-color:rgba(0,0,0,0.3); }
.record-field select { -webkit-appearance:none; appearance:none; }
.time-inputs { display:flex; align-items:center; gap:0.3rem; }
.time-inputs input { width:68px; text-align:center; font-size:1.7rem; font-weight:900; padding:0.45rem 0.25rem; letter-spacing:0.04em; }
.time-inputs .sep { color:#ccc; font-size:1.7rem; font-weight:900; }
.record-actions { display:flex; gap:0.5rem; margin-top:1.1rem; }
.record-actions button {
  flex:1; padding:0.72rem; font-size:0.8rem; font-weight:700; letter-spacing:0.14em;
  border:none; border-radius:6px; cursor:pointer;
}
#recordApplyBtn { background:#111; color:#fff; }
#recordClearBtn { background:rgba(0,0,0,0.06); color:#888; }

/* ── REVIEW ── */
#reviewScreen {
  display:none; position:fixed; inset:0; z-index:50; background:#f5f5f5;
  flex-direction:column; align-items:center; justify-content:center; gap:0;
}
#reviewImage { max-width:90%; max-height:70vh; object-fit:contain; box-shadow:0 4px 30px rgba(0,0,0,0.12); }
.review-actions {
  display:flex; gap:0.75rem; margin-top:1.4rem;
  padding-bottom:calc(0.5rem + var(--safe-bottom));
  flex-wrap:wrap; justify-content:center;
}
.review-btn {
  border:none; padding:0.85rem 1.8rem; font-size:0.78rem; font-weight:700;
  letter-spacing:0.2em; cursor:pointer; transition:opacity 0.2s;
}
.review-btn:active { opacity:0.65; }
.review-btn.share-save { background:#111; color:#fff; }
.review-btn.download-btn { background:transparent; color:rgba(0,0,0,0.5); border:1px solid rgba(0,0,0,0.15); padding:0.85rem 1.3rem; }
.review-btn.retake { background:transparent; color:rgba(0,0,0,0.4); border:1px solid rgba(0,0,0,0.12); }

/* ── MISC ── */
.flash { position:fixed; inset:0; background:#fff; z-index:60; animation:flashAnim 0.32s ease-out forwards; pointer-events:none; }
@keyframes flashAnim { 0%{opacity:0.85} 100%{opacity:0} }
#exportCanvas { display:none; }
.loading { display:inline-block; width:22px; height:22px; border:2.5px solid rgba(0,0,0,0.1); border-top-color:rgba(0,0,0,0.5); border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<!-- LANDING -->
<div id="permissionScreen">
  <section class="landing-hero">
    <div class="hero-brand">DARIMATI</div>
    <div class="hero-sub">REXTREME</div>
    <div class="hero-rule"></div>
    <p class="hero-detail">2026. 08. 01 &nbsp;·&nbsp; 수원컨벤션센터</p>
    <div class="hero-cta-area">
      <button id="startCameraBtn">START CAMERA</button>
      <p class="msg" id="permMsg"></p>
      <p class="cta-notice">카메라 접근 권한이 필요합니다.<br>촬영한 사진은 기기에만 저장됩니다.</p>
    </div>
    <p class="hero-bottom-mark">DARIMATI &nbsp;·&nbsp; Race Day Filter</p>
  </section>
</div>

<!-- MAIN APP -->
<div id="app">
  <div id="viewfinder">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="displayCanvas"></canvas>
  </div>

  <div id="segLoading">
    <span class="loading"></span>
    <span>LOADING...</span>
  </div>

  <div id="shutterCountdown">
    <span class="countdown-num" id="countdownNum"></span>
  </div>

  <!-- FILTER TOGGLE -->
  <div class="filter-btns" id="filterBtnsBar">
    <button class="filter-btn active" data-filter="ribbon">RIBBON</button>
    <button class="filter-btn" data-filter="sport">SPORT</button>
  </div>

  <!-- CONTROLS -->
  <div id="controlsBar">
    <button id="recordBtn" class="ctrl-btn" aria-label="Record">✎</button>
    <button id="shutterTimerBtn" class="ctrl-btn" aria-label="Shutter Timer">⏱<span id="shutterTimerBadge"></span></button>
    <button id="captureBtn" aria-label="Capture"></button>
    <button id="flipBtn" class="ctrl-btn" aria-label="Flip Camera">⟳</button>
  </div>
</div>

<!-- RECORD PANEL -->
<div id="recordPanel">
  <div class="panel-header">
    <span class="panel-title">⏱ 기록 입력</span>
    <button class="panel-close" id="recordCloseBtn">&times;</button>
  </div>
  <div class="record-field">
    <label>Finish Time</label>
    <div class="time-inputs">
      <input type="number" id="timeH" min="0" max="23" placeholder="H">
      <span class="sep">:</span>
      <input type="number" id="timeM" min="0" max="59" placeholder="MM">
      <span class="sep">:</span>
      <input type="number" id="timeS" min="0" max="59" placeholder="SS">
    </div>
  </div>
  <div class="record-field">
    <label>종목</label>
    <select id="recordCategory">
      <option value="개인전">개인전</option>
      <option value="3인팀전">3인팀전</option>
      <option value="혼성릴레이">혼성릴레이</option>
    </select>
  </div>
  <div class="record-field">
    <label>이름</label>
    <input type="text" id="recordName" placeholder="참가자 이름">
  </div>
  <div class="record-actions">
    <button id="recordClearBtn">초기화</button>
    <button id="recordApplyBtn">확인</button>
  </div>
</div>

<!-- REVIEW -->
<div id="reviewScreen">
  <img id="reviewImage" alt="Captured">
  <div class="review-actions">
    <button class="review-btn retake" id="retakeBtn">RETAKE</button>
    <button class="review-btn download-btn" id="downloadBtn">↓ SAVE</button>
    <button class="review-btn share-save" id="shareBtn">SHARE ↑</button>
  </div>
</div>

<canvas id="exportCanvas" width="1080" height="1920"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
(function() {
'use strict';

/* ══════════════════════════════════════════
   FRAME DEFINITIONS
══════════════════════════════════════════ */
var FRAME_DEFS = {
  ribbon: {
    src: 'frame-ribbon.png',
    // box opening area (fraction of canvas)
    opening: { x:0.065, y:0.025, w:0.87, h:0.72 }
  },
  sport: {
    src: 'frame-sport.png',
    opening: { x:0.058, y:0.060, w:0.884, h:0.65 }
  }
};

var SANS = '"Manrope",-apple-system,BlinkMacSystemFont,sans-serif';
var GOLD = '#C8A44E';

/* ══════════════════════════════════════════
   DOM REFS
══════════════════════════════════════════ */
var permScreen     = document.getElementById('permissionScreen');
var permMsg        = document.getElementById('permMsg');
var startBtn       = document.getElementById('startCameraBtn');
var app            = document.getElementById('app');
var video          = document.getElementById('cameraVideo');
var displayCanvas  = document.getElementById('displayCanvas');
var displayCtx     = displayCanvas.getContext('2d');
var captureBtn     = document.getElementById('captureBtn');
var flipBtn        = document.getElementById('flipBtn');
var recordBtn      = document.getElementById('recordBtn');
var recordPanel    = document.getElementById('recordPanel');
var recordCloseBtn = document.getElementById('recordCloseBtn');
var recordApplyBtn = document.getElementById('recordApplyBtn');
var recordClearBtn = document.getElementById('recordClearBtn');
var reviewScreen   = document.getElementById('reviewScreen');
var reviewImage    = document.getElementById('reviewImage');
var retakeBtn      = document.getElementById('retakeBtn');
var shareBtn       = document.getElementById('shareBtn');
var downloadBtn    = document.getElementById('downloadBtn');
var exportCanvas   = document.getElementById('exportCanvas');
var exportCtx      = exportCanvas.getContext('2d');
var filterBtns     = document.querySelectorAll('.filter-btn');
var segLoading     = document.getElementById('segLoading');
var shutterTimerBtn   = document.getElementById('shutterTimerBtn');
var shutterTimerBadge = document.getElementById('shutterTimerBadge');
var shutterCountdown  = document.getElementById('shutterCountdown');
var countdownNum      = document.getElementById('countdownNum');
var timeH = document.getElementById('timeH');
var timeM = document.getElementById('timeM');
var timeS = document.getElementById('timeS');
var recCat  = document.getElementById('recordCategory');
var recName = document.getElementById('recordName');

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
var facingMode     = 'user';
var isFront        = true;
var currentFrame   = 'ribbon';
var record         = null;
var capturedBlob   = null;
var lastMask       = null;
var lastImage      = null;
var segReady       = false;
var mpCamera       = null;
var selfieSegmentation = null;
var shutterDelay   = 0;
var shutterCountingDown = false;

// Pre-processed frame overlays
var frameCache = {};   // { ribbon: { display: canvas, export: canvas, img: Image }, ... }

// Reusable canvases
var personCanvas = document.createElement('canvas');
var personCtx    = personCanvas.getContext('2d');
var maskCanvas   = document.createElement('canvas');
var maskCtx      = maskCanvas.getContext('2d');

/* ══════════════════════════════════════════
   FRAME LOADING & PROCESSING
══════════════════════════════════════════ */
function loadFrameImage(src) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.onload = function() { resolve(img); };
    img.onerror = function() { reject(new Error('Failed to load ' + src)); };
    img.src = src;
  });
}

function createFrameOverlay(img, opening, w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d');

  // Draw full frame image scaled to canvas
  ctx.drawImage(img, 0, 0, w, h);

  // Cut out the box opening (transparent hole for person)
  var ox = Math.round(opening.x * w);
  var oy = Math.round(opening.y * h);
  var ow = Math.round(opening.w * w);
  var oh = Math.round(opening.h * h);

  // Feathered cutout: clear center, smooth edges
  var feather = Math.round(Math.min(w, h) * 0.005); // subtle feather

  // Clear the main opening
  ctx.clearRect(ox + feather, oy + feather, ow - feather*2, oh - feather*2);

  // Feather edges using gradient masks
  ctx.globalCompositeOperation = 'destination-out';

  // Top edge
  var g = ctx.createLinearGradient(0, oy, 0, oy + feather);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g;
  ctx.fillRect(ox + feather, oy, ow - feather*2, feather);

  // Bottom edge
  g = ctx.createLinearGradient(0, oy+oh, 0, oy+oh-feather);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g;
  ctx.fillRect(ox + feather, oy+oh-feather, ow - feather*2, feather);

  // Left edge
  g = ctx.createLinearGradient(ox, 0, ox + feather, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g;
  ctx.fillRect(ox, oy + feather, feather, oh - feather*2);

  // Right edge
  g = ctx.createLinearGradient(ox+ow, 0, ox+ow-feather, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g;
  ctx.fillRect(ox+ow-feather, oy + feather, feather, oh - feather*2);

  ctx.globalCompositeOperation = 'source-over';
  return c;
}

async function loadAllFrames() {
  var keys = Object.keys(FRAME_DEFS);
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var def = FRAME_DEFS[key];
    try {
      var img = await loadFrameImage(def.src);
      frameCache[key] = {
        img: img,
        display: createFrameOverlay(img, def.opening, 720, 1280),
        export:  createFrameOverlay(img, def.opening, 1080, 1920)
      };
    } catch(e) {
      console.warn('Frame load failed:', key, e);
    }
  }
}

/* ══════════════════════════════════════════
   FILTER TOGGLE
══════════════════════════════════════════ */
filterBtns.forEach(function(btn) {
  btn.addEventListener('click', function() {
    filterBtns.forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentFrame = btn.dataset.filter;
  });
});

/* ══════════════════════════════════════════
   SHUTTER TIMER
══════════════════════════════════════════ */
var SHUTTER_DELAYS = [0, 3, 5, 10];

shutterTimerBtn.addEventListener('click', function() {
  if (shutterCountingDown) return;
  var idx = SHUTTER_DELAYS.indexOf(shutterDelay);
  shutterDelay = SHUTTER_DELAYS[(idx + 1) % SHUTTER_DELAYS.length];
  if (shutterDelay === 0) {
    shutterTimerBadge.style.display = 'none';
    shutterTimerBtn.classList.remove('active');
  } else {
    shutterTimerBadge.style.display = 'flex';
    shutterTimerBadge.textContent = shutterDelay + 's';
    shutterTimerBtn.classList.add('active');
  }
});

function doShutterCountdown(seconds) {
  return new Promise(function(resolve) {
    shutterCountingDown = true;
    shutterCountdown.style.display = 'flex';
    var remaining = seconds;
    function showNum() {
      countdownNum.textContent = remaining;
      countdownNum.style.animation = 'none';
      void countdownNum.offsetHeight;
      countdownNum.style.animation = 'countPulse 0.8s ease-out';
    }
    showNum();
    var iv = setInterval(function() {
      remaining--;
      if (remaining <= 0) {
        clearInterval(iv);
        shutterCountdown.style.display = 'none';
        shutterCountingDown = false;
        resolve();
      } else {
        showNum();
      }
    }, 1000);
  });
}

/* ══════════════════════════════════════════
   RECORD PANEL
══════════════════════════════════════════ */
[timeH, timeM, timeS].forEach(function(inp, i, arr) {
  inp.addEventListener('input', function() {
    if (inp.value.length >= 2 && i < arr.length - 1) arr[i+1].focus();
    var max = i === 0 ? 23 : 59;
    if (parseInt(inp.value) > max) inp.value = max;
  });
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && inp.value === '' && i > 0) arr[i-1].focus();
  });
});

recordBtn.addEventListener('click', function() {
  recordPanel.style.display = 'block';
  setTimeout(function() { recordPanel.classList.add('open'); }, 10);
});
recordCloseBtn.addEventListener('click', closePanel);
function closePanel() {
  recordPanel.classList.remove('open');
  setTimeout(function() { recordPanel.style.display = 'none'; }, 340);
}

recordApplyBtn.addEventListener('click', function() {
  var h = timeH.value, m = timeM.value, s = timeS.value;
  var hasTime = h !== '' || m !== '' || s !== '';
  record = {
    time: hasTime
      ? (parseInt(h)||0) + ':' + String(parseInt(m)||0).padStart(2,'0') + ':' + String(parseInt(s)||0).padStart(2,'0')
      : null,
    category: recCat.value,
    name: recName.value || ''
  };
  recordBtn.classList.add('has-data');
  closePanel();
});

recordClearBtn.addEventListener('click', function() {
  record = null;
  timeH.value = ''; timeM.value = ''; timeS.value = '';
  recName.value = ''; recCat.selectedIndex = 0;
  recordBtn.classList.remove('has-data');
  closePanel();
});

/* ══════════════════════════════════════════
   MASK REFINEMENT
══════════════════════════════════════════ */
function refineMask(rawMask, w, h) {
  maskCanvas.width = w;
  maskCanvas.height = h;
  maskCtx.clearRect(0, 0, w, h);
  maskCtx.drawImage(rawMask, 0, 0, w, h);

  var imageData = maskCtx.getImageData(0, 0, w, h);
  var data = imageData.data;
  var threshold = 128, softZone = 40;
  for (var i = 3; i < data.length; i += 4) {
    var a = data[i];
    if (a > threshold + softZone) data[i] = 255;
    else if (a < threshold - softZone) data[i] = 0;
    else data[i] = Math.round(((a - (threshold - softZone)) / (softZone * 2)) * 255);
  }
  maskCtx.putImageData(imageData, 0, 0);

  var tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  var tCtx = tmp.getContext('2d');
  tCtx.filter = 'blur(1.5px)';
  tCtx.drawImage(maskCanvas, 0, 0);
  var bd = tCtx.getImageData(0, 0, w, h);
  var d = bd.data;
  for (var j = 3; j < d.length; j += 4) {
    d[j] = d[j] > 20 ? Math.min(255, Math.round(d[j] * 1.4)) : 0;
  }
  tCtx.putImageData(bd, 0, 0);
  return tmp;
}

/* ══════════════════════════════════════════
   SEGMENTATION + LIVE RENDERING
══════════════════════════════════════════ */
function onSegResults(results) {
  lastMask = results.segmentationMask;
  lastImage = results.image;

  var cw = displayCanvas.width;
  var ch = displayCanvas.height;

  // Refine mask
  var cleanMask = refineMask(results.segmentationMask, cw, ch);

  // Create person-only layer (transparent bg)
  personCanvas.width = cw;
  personCanvas.height = ch;
  personCtx.clearRect(0, 0, cw, ch);
  personCtx.save();
  if (isFront) { personCtx.translate(cw, 0); personCtx.scale(-1, 1); }
  personCtx.drawImage(cleanMask, 0, 0, cw, ch);
  personCtx.globalCompositeOperation = 'source-in';
  personCtx.drawImage(results.image, 0, 0, cw, ch);
  personCtx.restore();

  // Compose final frame
  displayCtx.clearRect(0, 0, cw, ch);

  // 1. White background
  displayCtx.fillStyle = '#FFFFFF';
  displayCtx.fillRect(0, 0, cw, ch);

  // 2. Person
  displayCtx.drawImage(personCanvas, 0, 0, cw, ch);

  // 3. Frame overlay (with transparent opening)
  var fc = frameCache[currentFrame];
  if (fc && fc.display) {
    displayCtx.drawImage(fc.display, 0, 0, cw, ch);
  }
}

function initSegmentation() {
  segLoading.style.display = 'flex';

  selfieSegmentation = new SelfieSegmentation({
    locateFile: function(file) {
      return 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/' + file;
    }
  });
  selfieSegmentation.setOptions({ modelSelection: 1, selfieMode: true });
  selfieSegmentation.onResults(onSegResults);

  mpCamera = new Camera(video, {
    onFrame: async function() {
      if (selfieSegmentation) await selfieSegmentation.send({image: video});
    },
    width: 720, height: 1280, facingMode: facingMode
  });
  mpCamera.start().then(function() {
    isFront = facingMode === 'user';
    segLoading.style.display = 'none';
    segReady = true;
  }).catch(function(err) {
    console.error('Camera start failed', err);
    segLoading.style.display = 'none';
    fallbackRawVideo();
  });
}

function fallbackRawVideo() {
  function drawRaw() {
    if (video.readyState >= 2) {
      var cw = displayCanvas.width, ch = displayCanvas.height;
      displayCtx.save();
      displayCtx.fillStyle = '#FFFFFF';
      displayCtx.fillRect(0, 0, cw, ch);
      if (isFront) { displayCtx.translate(cw, 0); displayCtx.scale(-1, 1); }
      var vw = video.videoWidth, vh = video.videoHeight;
      var va = vw/vh, ca = cw/ch;
      var sx,sy,sw,sh;
      if (va > ca) { sh=vh; sw=vh*ca; sx=(vw-sw)/2; sy=0; }
      else { sw=vw; sh=vw/ca; sx=0; sy=(vh-sh)/2; }
      displayCtx.drawImage(video, sx,sy,sw,sh, 0,0,cw,ch);
      displayCtx.restore();
      var fc = frameCache[currentFrame];
      if (fc && fc.display) displayCtx.drawImage(fc.display, 0, 0, cw, ch);
    }
    requestAnimationFrame(drawRaw);
  }
  drawRaw();
}

function resizeDisplayCanvas() {
  displayCanvas.width = 720;
  displayCanvas.height = 1280;
}

/* ══════════════════════════════════════════
   EXPORT CANVAS (1080×1920)
══════════════════════════════════════════ */
async function renderExportCanvas() {
  var W = 1080, H = 1920;
  exportCanvas.width = W; exportCanvas.height = H;
  var c = exportCtx;

  c.clearRect(0, 0, W, H);
  c.fillStyle = '#FFFFFF';
  c.fillRect(0, 0, W, H);

  // Draw person
  if (lastMask && lastImage) {
    var cleanMask = refineMask(lastMask, W, H);
    var tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    var tCtx = tmp.getContext('2d');
    tCtx.save();
    if (isFront) { tCtx.translate(W, 0); tCtx.scale(-1, 1); }
    tCtx.drawImage(cleanMask, 0, 0, W, H);
    tCtx.globalCompositeOperation = 'source-in';
    tCtx.drawImage(lastImage, 0, 0, W, H);
    tCtx.restore();
    c.drawImage(tmp, 0, 0, W, H);
  }

  // Draw frame overlay
  var fc = frameCache[currentFrame];
  if (fc && fc.export) {
    c.drawImage(fc.export, 0, 0, W, H);
  }

  // Draw dynamic record data on top of the bottom info bar
  if (record && record.time) {
    drawRecordOnExport(c, W, H);
  }
}

function drawRecordOnExport(c, W, H) {
  // The bottom bar area of both frames is roughly the bottom 22%
  var barY = Math.round(H * 0.79);
  var barH = H - barY;
  var px = Math.round(W * 0.06);
  var rx = W - px;

  // Semi-transparent overlay to soften baked text
  c.fillStyle = 'rgba(255,255,255,0.82)';
  c.fillRect(0, barY, W, barH);

  // Thin top border
  c.strokeStyle = 'rgba(0,0,0,0.08)';
  c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(px, barY + 10); c.lineTo(rx, barY + 10); c.stroke();

  var textY = barY + 46;

  // Left side: RUN.YOUR.CITY.
  c.textAlign = 'left';
  c.textBaseline = 'top';
  c.fillStyle = '#111';
  c.font = '800 48px ' + SANS;
  c.fillText('RUN.', px, textY);
  c.fillText('YOUR.', px, textY + 54);
  c.fillText('CITY.', px, textY + 108);

  // Hashtags
  c.font = '500 18px ' + SANS;
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.fillText('#DARIMATI  #REXTREME  #다리마티  #렉스트림', px, textY + 170);

  // Center: DARIMATI + icon
  c.textAlign = 'center';
  c.fillStyle = '#111';
  c.font = '800 30px ' + SANS;
  c.fillText('D A R I M A T I', W/2, textY + 36);
  c.fillStyle = GOLD;
  c.font = '700 18px ' + SANS;
  c.fillText('REXTREME', W/2, textY + 72);

  // Right: TIME + record
  c.textAlign = 'right';

  // TIME label
  c.fillStyle = 'rgba(0,0,0,0.4)';
  c.font = '600 16px ' + SANS;
  c.fillText('TIME', rx, textY);

  // Finish time (big)
  c.fillStyle = '#111';
  c.font = '900 52px ' + SANS;
  c.fillText(record.time, rx, textY + 20);

  // Category
  c.fillStyle = 'rgba(0,0,0,0.55)';
  c.font = '700 20px ' + SANS;
  c.fillText(record.category, rx, textY + 82);

  if (record.name) {
    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.font = '600 18px ' + SANS;
    c.fillText(record.name, rx, textY + 110);
  }

  // DATE
  c.fillStyle = 'rgba(0,0,0,0.4)';
  c.font = '600 16px ' + SANS;
  c.fillText('DATE', rx, textY + 140);

  c.fillStyle = '#111';
  c.font = '800 28px ' + SANS;
  c.fillText('2026.08.01', rx, textY + 160);

  c.fillStyle = 'rgba(0,0,0,0.45)';
  c.font = '600 18px ' + SANS;
  c.fillText('수원컨벤션센터', rx, textY + 195);
}

/* ══════════════════════════════════════════
   CAMERA START / FLIP
══════════════════════════════════════════ */
startBtn.addEventListener('click', async function() {
  startBtn.innerHTML = '<span class="loading"></span>';

  // Load frames first
  await loadAllFrames();

  permScreen.style.display = 'none';
  app.style.display = 'block';
  resizeDisplayCanvas();
  initSegmentation();
});

flipBtn.addEventListener('click', async function() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  isFront = facingMode === 'user';
  if (mpCamera) mpCamera.stop();
  segLoading.style.display = 'flex';
  mpCamera = new Camera(video, {
    onFrame: async function() {
      if (selfieSegmentation) await selfieSegmentation.send({image: video});
    },
    width: 720, height: 1280, facingMode: facingMode
  });
  mpCamera.start().then(function() {
    segLoading.style.display = 'none';
  }).catch(function(err) {
    console.error('Flip failed', err);
    segLoading.style.display = 'none';
  });
});

/* ══════════════════════════════════════════
   CAPTURE
══════════════════════════════════════════ */
captureBtn.addEventListener('click', async function() {
  if (shutterCountingDown) return;
  if (shutterDelay > 0) await doShutterCountdown(shutterDelay);

  var flash = document.createElement('div');
  flash.className = 'flash';
  document.body.appendChild(flash);
  setTimeout(function(){ flash.remove(); }, 380);

  await renderExportCanvas();
  capturedBlob = await new Promise(function(res) { exportCanvas.toBlob(res, 'image/jpeg', 0.93); });
  reviewImage.src = URL.createObjectURL(capturedBlob);
  reviewScreen.style.display = 'flex';
});

/* ══════════════════════════════════════════
   SHARE / DOWNLOAD
══════════════════════════════════════════ */
shareBtn.addEventListener('click', async function() {
  if (!capturedBlob) return;
  var fname = 'DARIMATI_20260801.jpg';
  var file = new File([capturedBlob], fname, { type:'image/jpeg' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files:[file] })) {
    try { await navigator.share({ title:'DARIMATI Race Day', text:'#DARIMATI #REXTREME', files:[file] }); return; }
    catch(err) { if (err.name === 'AbortError') return; }
  }
  triggerDownload(fname);
});

downloadBtn.addEventListener('click', function() {
  triggerDownload('DARIMATI_20260801.jpg');
});

function triggerDownload(fname) {
  if (!capturedBlob) return;
  var url = URL.createObjectURL(capturedBlob);
  var a = document.createElement('a'); a.href = url; a.download = fname; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

retakeBtn.addEventListener('click', function() {
  reviewScreen.style.display = 'none';
  if (capturedBlob) { URL.revokeObjectURL(reviewImage.src); capturedBlob = null; }
});

/* ══════════════════════════════════════════
   RESIZE
══════════════════════════════════════════ */
window.addEventListener('resize', function() {
  if (app.style.display !== 'none') resizeDisplayCanvas();
});

})();
</script>
